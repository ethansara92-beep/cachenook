name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Verify version
        run: test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"

      - run: npm run pack

      - name: Build DMG
        env:
          SKIP_PACK: 1
        run: npm run dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CacheNook-${{ inputs.version }}
          path: |
            dist/CacheNook-*.dmg
            dist/CacheNook-*.dmg.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            dist/CacheNook-*.dmg dist/CacheNook-*.dmg.sha256 \
            --title "CacheNook ${{ inputs.version }}" \
            --notes "Unsigned build. See docs/release.md for signing and notarization."
